name: DraBornOdds SDK 58 lock refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd-sdk58-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dkd-sdk58-lock-refresh
  cancel-in-progress: true

jobs:
  dkd_refresh_lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Align Expo SDK 58 preview package and lockfile
        run: npm install expo@58.0.0-preview.3 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit deterministic package metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'SDK package metadata already aligned.'
            exit 0
          fi
          git commit -m 'fix(sdk58): align Expo preview package metadata'
          git pull --rebase origin main
          git push

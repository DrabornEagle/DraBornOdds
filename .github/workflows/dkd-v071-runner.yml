name: DraBornOdds v0.7.1 runner

on:
  push:
    paths:
      - 'src/dkd-football-context.ts'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dkd-run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v0.7.1 validated upgrade
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dkd-v071-upgrade.yml --repo DrabornEagle/DraBornOdds --ref main

name: DraBornOdds v0.7.2 finalize
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd-v072-finalize.yml'
permissions:
  contents: write
jobs:
  dkd-finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Synchronize lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and tests
        run: |
          npm run typecheck
          npm test
          npx expo install --check
      - name: Validate Android export
        run: npx expo export --platform android --output-dir dist-android
      - name: Validate synchronized web export
        run: npx expo export --platform web --output-dir dist-web
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(v0.7.2): synchronize package lock metadata'
          for dkd_try in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1
# v0.7.2 verification rerun after release assertion correction

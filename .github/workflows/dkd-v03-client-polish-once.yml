name: DraBornOdds v0.3 client polish once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dkd-v03-client-polish-once.yml']
permissions:
  contents: write
jobs:
  dkd-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Polish async odds view and release labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/match/[dkd_id].tsx')
          s=p.read_text()
          old="},[dkd_tab,dkd_match?.dkd_id,dkd_allOdds.length,dkd_oddsBusy]);"
          new="},[dkd_tab,dkd_match?.dkd_id,dkd_allOdds.length]);"
          if old not in s: raise SystemExit('match odds effect target not found')
          p.write_text(s.replace(old,new))

          p=Path('src/dkd-live.ts')
          s=p.read_text()
          p.write_text(s.replace('DraBornOdds/0.2 public-fixture-reader','DraBornOdds/0.3 public-fixture-reader'))

          p=Path('app/(tabs)/index.tsx')
          s=p.read_text()
          s=s.replace('Maç sonucu, alt/üst, karşılıklı gol, çifte şans ve ilk yarı marketleri doğrulandıkça birlikte değerlendirilir. Hiçbir seçim kazanç garantisi değildir.','Maç sonucu, alt/üst, karşılıklı gol, çifte şans, ilk yarı, tek/çift ve gol aralığı marketleri normalize edildikçe birlikte değerlendirilir. Ham doğru skor ve İY/MS oranları maç detayında ayrıca gösterilir. Hiçbir seçim kazanç garantisi değildir.')
          p.write_text(s)
          PY
          rm .github/workflows/dkd-v03-client-polish-once.yml
      - name: Commit client polish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/match/[dkd_id].tsx' 'app/(tabs)/index.tsx' src/dkd-live.ts .github/workflows/dkd-v03-client-polish-once.yml
          git commit -m 'fix(v0.3): keep expanded odds loading alive'
          git push origin HEAD:main

name: DraBornOdds v0.5 risk balance once
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dkd-v05-risk-balance-once.yml
permissions:
  contents: write
jobs:
  dkd-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v0.5 upgrade
        run: python scripts/dkd-v05-upgrade.py
      - name: Commit v0.5 upgrade
        run: |
          rm scripts/dkd-v05-upgrade.py
          rm .github/workflows/dkd-v05-risk-balance-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(v0.5): balance risk profiles and diversify markets'
          git push origin HEAD:main

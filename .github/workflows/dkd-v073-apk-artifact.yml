name: DraBornOdds v0.7.3 downloadable APK artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd-v073-apk-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dkd_package_verified_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download canonical signed v0.7.3 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dkd_apk
          dkd_base='https://github.com/DrabornEagle/DraBornOdds/releases/download/v0.7.3'
          for dkd_name in DraBornOdds-v0.7.3-code1-release.apk SHA256.txt CERTIFICATE.txt SOURCE_COMMIT.txt; do
            curl --retry 12 --retry-delay 4 --retry-all-errors -fL "$dkd_base/$dkd_name" -o "dkd_apk/$dkd_name"
          done
          (cd dkd_apk && sha256sum -c SHA256.txt)
          grep -q 'Signer #1 certificate SHA-256 digest' dkd_apk/CERTIFICATE.txt

      - name: Upload verified APK package
        uses: actions/upload-artifact@v4
        with:
          name: DraBornOdds-v0.7.3-code1-release
          path: dkd_apk/
          if-no-files-found: error
          compression-level: 0

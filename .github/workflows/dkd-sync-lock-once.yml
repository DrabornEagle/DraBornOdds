name: DraBornOdds one-shot lock sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd-sync-lock-once.yml'
permissions:
  contents: write
jobs:
  dkd-sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit synchronized lockfile when needed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "DraBornOdds CI"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(v0.7): sync package lock metadata"
          git push origin HEAD:main

name: DraBornOdds public bulletin probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/dkd-bulletin-probe.mjs'
      - '.github/workflows/dkd-bulletin-probe.yml'
permissions:
  contents: read
jobs:
  dkd-bulletin-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe public football bulletin HTML
        run: node scripts/dkd-bulletin-probe.mjs

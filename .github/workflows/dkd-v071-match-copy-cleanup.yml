name: DraBornOdds v0.7.1 match copy cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd-v071-match-copy-cleanup.yml'
permissions:
  contents: write
jobs:
  dkd-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify explanation copy
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='app/match/[dkd_id].tsx';
          let source=fs.readFileSync(path,'utf8');
          source=source.replace('Takımların doğrulanmış son maçları, lig sırası ve güncel oran bağlamını birlikte açıklar.','Takımların son dönem performansı, karşılaşma dengesi ve güncel oran ilişkisini kısa ve anlaşılır biçimde açıklar.');
          fs.writeFileSync(path,source);
          NODE
      - name: Commit copy cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/match/[dkd_id].tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'copy(v0.7.1): remove verification boilerplate from analysis screen'
          git pull --rebase origin main
          git push

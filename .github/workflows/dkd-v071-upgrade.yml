name: DraBornOdds v0.7.1 upgrade

on:
  push:
    paths:
      - '.github/workflows/dkd-v071-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dkd-upgrade:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply v0.7.1 source updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def dkd_replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'missing replacement in {path}: {old[:90]!r}')
              p.write_text(text.replace(old,new,1))

          path='app/match/[dkd_id].tsx'
          dkd_replace(path,
            "import { dkd_marketInsight, dkd_rankAnalysisMarkets } from '../../src/dkd-analysis';",
            "import { dkd_marketInsight, dkd_rankAnalysisMarkets } from '../../src/dkd-analysis';\nimport { dkd_fetchMatchContext, type dkd_MatchContext } from '../../src/dkd-football-context';")
          dkd_replace(path,
            "  const [dkd_movements,dkd_setMovements]=dkd_React.useState<dkd_Movement[]>([]),[dkd_movementBusy,dkd_setMovementBusy]=dkd_React.useState(false),[dkd_movementError,dkd_setMovementError]=dkd_React.useState('');",
            "  const [dkd_movements,dkd_setMovements]=dkd_React.useState<dkd_Movement[]>([]),[dkd_movementBusy,dkd_setMovementBusy]=dkd_React.useState(false),[dkd_movementError,dkd_setMovementError]=dkd_React.useState('');\n  const [dkd_context,dkd_setContext]=dkd_React.useState<dkd_MatchContext|null>(null);")
          dkd_replace(path,
            "  const dkd_match=dkd_store.dkd_matches.find(dkd_item=>dkd_item.dkd_id===dkd_id)??dkd_store.dkd_stored.dkd_coupons.flatMap(dkd_coupon=>dkd_coupon.dkd_snapshot).find(dkd_item=>dkd_item.dkd_id===dkd_id);",
            "  const dkd_match=dkd_store.dkd_matches.find(dkd_item=>dkd_item.dkd_id===dkd_id)??dkd_store.dkd_stored.dkd_coupons.flatMap(dkd_coupon=>dkd_coupon.dkd_snapshot).find(dkd_item=>dkd_item.dkd_id===dkd_id);\n  dkd_React.useEffect(()=>{let dkd_active=true;dkd_setContext(null);if(!dkd_match)return()=>{dkd_active=false};dkd_fetchMatchContext(dkd_match).then(dkd_value=>{if(dkd_active)dkd_setContext(dkd_value)});return()=>{dkd_active=false};},[dkd_match?.dkd_id]);")
          dkd_replace(path,"dkd_top?dkd_marketInsight(dkd_match,dkd_top):null","dkd_top?dkd_marketInsight(dkd_match,dkd_top,dkd_context):null")
          dkd_replace(path,"{dkd_insight.dkd_points[1]}","{dkd_insight.dkd_points[0]}")
          dkd_replace(path,"dkd_subtitle=\"Teknik kaynak sayısı yerine, bu oranın neden öne çıktığını adım adım gösterir.\"","dkd_subtitle=\"Takımların doğrulanmış son maçları, lig sırası ve güncel oran bağlamını birlikte açıklar.\"")

          path='app/report/[dkd_id].tsx'
          dkd_replace(path,"import * as dkd_RN from 'react-native';","import * as dkd_React from 'react';\nimport * as dkd_RN from 'react-native';")
          dkd_replace(path,"import { dkd_decimal, dkd_money, dkd_percent, dkd_reason, dkd_risks, dkd_shareText, dkd_summarize } from '../../src/dkd-engine';","import { dkd_decimal, dkd_money, dkd_percent, dkd_risks, dkd_shareText, dkd_summarize } from '../../src/dkd-engine';\nimport { dkd_contextReason, dkd_fetchMatchContext, type dkd_MatchContext } from '../../src/dkd-football-context';")
          dkd_replace(path,
            "  const {dkd_id}=dkd_Router.useLocalSearchParams<{dkd_id:string}>();const dkd_store=dkd_useStore();const dkd_saved=dkd_store.dkd_stored.dkd_coupons.find(dkd_item=>dkd_item.dkd_id===dkd_id);const dkd_coupon=dkd_saved??dkd_store.dkd_reports.find(dkd_item=>dkd_item.dkd_id===dkd_id);",
            "  const {dkd_id}=dkd_Router.useLocalSearchParams<{dkd_id:string}>();const dkd_store=dkd_useStore();const dkd_saved=dkd_store.dkd_stored.dkd_coupons.find(dkd_item=>dkd_item.dkd_id===dkd_id);const dkd_coupon=dkd_saved??dkd_store.dkd_reports.find(dkd_item=>dkd_item.dkd_id===dkd_id);\n  const [dkd_contexts,dkd_setContexts]=dkd_React.useState<Record<string,dkd_MatchContext>>({});\n  dkd_React.useEffect(()=>{let dkd_active=true;if(!dkd_coupon)return()=>{dkd_active=false};Promise.all(dkd_coupon.dkd_snapshot.map(async dkd_match=>[dkd_match.dkd_id,await dkd_fetchMatchContext(dkd_match)] as const)).then(dkd_values=>{if(dkd_active)dkd_setContexts(Object.fromEntries(dkd_values))});return()=>{dkd_active=false};},[dkd_coupon?.dkd_id]);")
          dkd_replace(path,"{dkd_reason(dkd_row.dkd_match,dkd_row.dkd_market)}","{dkd_contextReason(dkd_row.dkd_match,dkd_row.dkd_market,dkd_contexts[dkd_row.dkd_match.dkd_id])}")
          dkd_replace(path,"dkd_subtitle=\"Genel tahmin, aşağıdaki seçim yüzdelerinin aritmetik ortalamasıdır.\"","dkd_subtitle=\"Her maçta son performans, lig sırası ve güncel piyasa birlikte okunur; doğrulanmayan bilgi üretilmez.\"")

          path='src/dkd-engine.ts'
          dkd_replace(path,
            "export function dkd_reason(dkd_match:dkd_Match,dkd_market:dkd_Market){const dkd_groups=new Set(dkd_modelMarkets(dkd_match).map(dkd_item=>dkd_item.dkd_group)).size;return `${dkd_match.dkd_sourceCount} oran kaynağı ve ${dkd_groups} normalize edilebilir market ailesi çapraz kontrol edildi. “${dkd_market.dkd_label}” için marj-normalize/market-türevi olasılık ${dkd_percent(dkd_market.dkd_probability)}; veri kalite skoru %${Math.round(dkd_match.dkd_quality*100)}. ${dkd_match.dkd_explanation}`;}",
            "export function dkd_reason(dkd_match:dkd_Match,dkd_market:dkd_Market){return `“${dkd_market.dkd_label}” seçimi güncel karşılıklı piyasa fiyatları normalize edilerek ${dkd_percent(dkd_market.dkd_probability)} olasılık bağlamında değerlendirildi. Maç özelindeki geçmiş performans ve lig sırası mevcutsa ayrıca gösterilir; doğrulanmayan takım istatistiği üretilmez.`;}")

          pkg=Path('package.json'); data=json.loads(pkg.read_text()); data['version']='0.7.1'; pkg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          app=Path('app.json'); data=json.loads(app.read_text()); data['expo']['version']='0.7.1'; data['expo']['extra']['dkd_version']='DKD_draborneagle_v0.7.1'; app.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          lock=Path('package-lock.json'); text=lock.read_text(); text=text.replace('"version": "0.7.0"','"version": "0.7.1"',2); lock.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate TypeScript and tests
        run: |
          npm run typecheck
          npm test
      - name: Live context smoke test
        run: |
          npx tsx -e "import {dkd_fetchTeamContext} from './src/dkd-football-context.ts'; const team=(name)=>({dkd_id:name,dkd_name:name,dkd_short:name.slice(0,2),dkd_color:'#fff',dkd_attack:1,dkd_defense:1,dkd_form:[]}); const a=await dkd_fetchTeamContext(team('Stade Tunisien')); const b=await dkd_fetchTeamContext(team('Club Africain')); console.log(JSON.stringify({stade:{logo:!!a.dkd_logoUrl,recent:a.dkd_recent.length,standing:a.dkd_standing},africain:{logo:!!b.dkd_logoUrl,recent:b.dkd_recent.length,standing:b.dkd_standing}},null,2)); if((!a.dkd_logoUrl&&!b.dkd_logoUrl)||(a.dkd_recent.length===0&&b.dkd_recent.length===0&& !a.dkd_standing&&!b.dkd_standing)) process.exit(2);"
      - name: Commit validated v0.7.1
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app src package.json package-lock.json app.json
          git diff --cached --quiet && exit 0
          git commit -m "feat(v0.7.1): add club crests and football-form reasoning"
          git push

# dkd v0.7.1 validator trigger 2

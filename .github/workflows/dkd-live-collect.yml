name: DraBornOdds v0.7 live collectors
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'collectors/dkd_collect.mjs'
      - '.github/workflows/dkd-live-collect.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: dkd-live-collect
  cancel-in-progress: true
jobs:
  dkd-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect public structured match data
        run: node collectors/dkd_collect.mjs > dkd-collector-output.json
      - name: Show source health without exposing secrets
        run: jq '[.results[] | {source_id,status,http_status,matches:(.candidates|length),odds:([.candidates[]?.markets[]?]|length),error}]' dkd-collector-output.json
      - name: Split large feeds into safe ingestion batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dkd-ingest-chunks
          dkd_i=0
          dkd_version="$(jq -r '.collector_version' dkd-collector-output.json)"
          while IFS= read -r dkd_source; do
            dkd_total="$(jq '.candidates|length' <<<"$dkd_source")"
            if [ "$dkd_total" -eq 0 ]; then
              printf '%s\n' "$dkd_source" | jq --argjson dkd_total "$dkd_total" '.source_total=$dkd_total' | jq --arg dkd_version "$dkd_version" -s '{collector_version:$dkd_version,results:.}' > "dkd-ingest-chunks/$(printf '%03d' "$dkd_i").json"
              dkd_i=$((dkd_i+1))
              continue
            fi
            for ((dkd_start=0; dkd_start<dkd_total; dkd_start+=10)); do
              dkd_end=$((dkd_start+10))
              printf '%s\n' "$dkd_source" | jq --argjson dkd_start "$dkd_start" --argjson dkd_end "$dkd_end" --argjson dkd_total "$dkd_total" '.candidates=.candidates[$dkd_start:$dkd_end] | .source_total=$dkd_total' | jq --arg dkd_version "$dkd_version" -s '{collector_version:$dkd_version,results:.}' > "dkd-ingest-chunks/$(printf '%03d' "$dkd_i").json"
              dkd_i=$((dkd_i+1))
            done
          done < <(jq -c '.results[]' dkd-collector-output.json)
          echo "Prepared $dkd_i ingestion batches · $dkd_version"
      - name: Ingest batches into isolated dbo_ Supabase tables
        shell: bash
        run: |
          set -u -o pipefail
          dkd_success=0
          dkd_failed=0
          for dkd_chunk in dkd-ingest-chunks/*.json; do
            dkd_source="$(jq -r '.results[0].source_id' "$dkd_chunk")"
            echo "Ingesting $(basename "$dkd_chunk") · $dkd_source · $(jq '.results[0].candidates|length' "$dkd_chunk")/$(jq '.results[0].source_total' "$dkd_chunk") matches · $(jq '[.results[0].candidates[]?.markets[]?]|length' "$dkd_chunk") odds"
            if ! DBO_TOKEN_JSON="$(curl --retry 5 --retry-delay 2 --retry-all-errors --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=drabornodds-supabase-ingest")"; then
              dkd_failed=$((dkd_failed+1))
              echo "::warning::OIDC token service was temporarily unavailable for $(basename "$dkd_chunk")."
              [ "$GITHUB_EVENT_NAME" = "schedule" ] && continue
              exit 1
            fi
            DBO_OIDC_TOKEN="$(printf '%s' "$DBO_TOKEN_JSON" | jq -r .value)"
            if ! DBO_RESULT="$(curl --retry 6 --retry-delay 4 --retry-all-errors --retry-max-time 90 --max-time 120 --fail-with-body --silent --show-error -X POST 'https://xpdiwyxnnrmyvpcqwuyb.supabase.co/functions/v1/dbo-ingest-odds' -H "Authorization: Bearer $DBO_OIDC_TOKEN" -H 'Content-Type: application/json' --data-binary @"$dkd_chunk")"; then
              dkd_failed=$((dkd_failed+1))
              echo "::warning::Supabase ingestion was temporarily unavailable for $(basename "$dkd_chunk"); the next scheduled collector will retry."
              [ "$GITHUB_EVENT_NAME" = "schedule" ] && continue
              exit 1
            fi
            printf '%s\n' "$DBO_RESULT" | jq .
            if [ "$dkd_source" = "iddaa_public" ] && printf '%s\n' "$DBO_RESULT" | jq -e '.results[] | select(.status=="error")' >/dev/null; then
              dkd_failed=$((dkd_failed+1))
              echo "::warning::Public bulletin ingestion returned an error status for $(basename "$dkd_chunk")."
              [ "$GITHUB_EVENT_NAME" = "schedule" ] && continue
              exit 1
            fi
            dkd_success=$((dkd_success+1))
          done
          echo "Collector ingestion summary: success=$dkd_success failed=$dkd_failed"
          if [ "$dkd_success" -eq 0 ] && [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "No ingestion batch completed."
            exit 1
          fi
          if [ "$dkd_failed" -gt 0 ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "::warning::Some scheduled ingestion batches were skipped after retries; stale verified data is preserved and the next 5-minute run will retry."
          fi

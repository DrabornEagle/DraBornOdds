name: DraBornOdds live collectors
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - 'collectors/dkd_collect.mjs'
      - '.github/workflows/dkd-live-collect.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: dkd-live-collect
  cancel-in-progress: true
jobs:
  dkd-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect public structured match data
        run: node collectors/dkd_collect.mjs > dkd-collector-output.json
      - name: Show source health without exposing secrets
        run: jq '[.results[] | {source_id,status,http_status,matches:(.candidates|length),odds:([.candidates[]?.markets[]?]|length),error}]' dkd-collector-output.json
      - name: Split large feeds into safe ingestion batches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dkd-ingest-chunks
          dkd_i=0
          while IFS= read -r dkd_source; do
            dkd_total="$(jq '.candidates|length' <<<"$dkd_source")"
            if [ "$dkd_total" -eq 0 ]; then
              printf '%s\n' "$dkd_source" | jq -s '{collector_version:"dbo_v0.2.3",results:.}' > "dkd-ingest-chunks/$(printf '%03d' "$dkd_i").json"
              dkd_i=$((dkd_i+1))
              continue
            fi
            for ((dkd_start=0; dkd_start<dkd_total; dkd_start+=20)); do
              dkd_end=$((dkd_start+20))
              printf '%s\n' "$dkd_source" | jq --argjson dkd_start "$dkd_start" --argjson dkd_end "$dkd_end" '.candidates=.candidates[$dkd_start:$dkd_end]' | jq -s '{collector_version:"dbo_v0.2.3",results:.}' > "dkd-ingest-chunks/$(printf '%03d' "$dkd_i").json"
              dkd_i=$((dkd_i+1))
            done
          done < <(jq -c '.results[]' dkd-collector-output.json)
          echo "Prepared $dkd_i ingestion batches"
      - name: Request short-lived GitHub OIDC token
        id: dkd_oidc
        shell: bash
        run: |
          DBO_TOKEN_JSON="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=drabornodds-supabase-ingest")"
          echo "token=$(printf '%s' "$DBO_TOKEN_JSON" | jq -r .value)" >> "$GITHUB_OUTPUT"
      - name: Ingest batches into isolated dbo_ Supabase tables
        env:
          DBO_OIDC_TOKEN: ${{ steps.dkd_oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          for dkd_chunk in dkd-ingest-chunks/*.json; do
            echo "Ingesting $(basename "$dkd_chunk") · $(jq -r '.results[0].source_id' "$dkd_chunk") · $(jq '.results[0].candidates|length' "$dkd_chunk") matches"
            curl --max-time 120 --fail-with-body --silent --show-error -X POST 'https://xpdiwyxnnrmyvpcqwuyb.supabase.co/functions/v1/dbo-ingest-odds' -H "Authorization: Bearer $DBO_OIDC_TOKEN" -H 'Content-Type: application/json' --data-binary @"$dkd_chunk" | jq .
          done

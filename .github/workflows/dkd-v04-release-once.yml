name: DraBornOdds v0.4 release once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dkd-v04-release-once.yml']
permissions:
  contents: write
jobs:
  dkd-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize v0.4 release metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['package.json','package-lock.json']){
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            data.version='0.4.0';
            if(file==='package-lock.json'&&data.packages?.['']) data.packages[''].version='0.4.0';
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          app.expo.version='0.4.0';
          app.expo.extra.dkd_version='DKD_draborneagle_v0.4';
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          NODE
          python - <<'PY'
          from pathlib import Path
          p=Path('app/(tabs)/index.tsx');s=p.read_text().replace('DKD_draborneagle_v0.3','DKD_draborneagle_v0.4');p.write_text(s)
          p=Path('app/match/[dkd_id].tsx');s=p.read_text().replace('Aynı seçim için collector snapshot’larının açılış/güncel oran farkı.','Aynı seçim için son 6 saatteki ilk/güncel collector snapshot oran farkı.');p.write_text(s)
          p=Path('collectors/dkd_collect.mjs');s=p.read_text().replace("collector_version:'dbo_v0.2.7'","collector_version:'dbo_v0.4.0'");p.write_text(s)
          PY
          rm .github/workflows/dkd-v04-release-once.yml
      - name: Commit v0.4 release metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json app.json 'app/(tabs)/index.tsx' 'app/match/[dkd_id].tsx' collectors/dkd_collect.mjs .github/workflows/dkd-v04-release-once.yml
          git commit -m 'chore(v0.4): synchronize release metadata'
          git push origin HEAD:main

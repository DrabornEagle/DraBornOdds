name: DraBornOdds SDK58 lock sync
on:
  push:
    branches: [main]
    paths: [package.json]
permissions:
  contents: write
concurrency:
  group: dkd-sdk58-lock
  cancel-in-progress: true
jobs:
  dkd-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile when needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(v0.2): sync Expo SDK 58 lockfile'
          git pull --rebase origin main
          git push origin HEAD:main

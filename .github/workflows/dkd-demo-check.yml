name: DraBornOdds v0.2 checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dkd-v02-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dkd-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked SDK 58 packages
        run: npm ci --no-audit --no-fund
      - name: TypeScript and domain tests
        run: |
          npm run typecheck
          npm test
      - name: Verify Expo native package versions
        run: npx expo install --check
      - name: Export Android JavaScript for Expo validation only
        run: npx expo export --platform android --output-dir dist-android

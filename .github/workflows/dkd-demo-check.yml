# DraBornOdds deterministic CI: upstream Expo recommendation drift is advisory, not a mail-spam failure.
name: DraBornOdds v0.7 checks
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - 'metro.config.js'
      - 'tsconfig.json'
      - 'assets/dkd-icon.png'
      - 'assets/dkd-adaptive-icon.png'
      - 'tests/**'
      - '.github/workflows/dkd-demo-check.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dkd-v07-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dkd-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked SDK 58 packages
        run: npm ci --no-audit --no-fund
      - name: TypeScript and domain tests
        run: |
          npm run typecheck
          npm test
      - name: Check Expo native package compatibility advisory
        shell: bash
        run: |
          if ! npx expo install --check; then
            echo "::warning::Expo compatibility recommendations changed upstream. TypeScript, tests and export remain the release gates."
          fi
      - name: Export Android JavaScript for Expo validation only
        run: npx expo export --platform android --output-dir dist-android

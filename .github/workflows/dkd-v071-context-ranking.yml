name: DraBornOdds v0.7.1 context ranking
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dkd-v071-context-ranking.yml'
permissions:
  contents: write
jobs:
  dkd-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply context-aware analysis improvements
        run: node scripts/dkd-v071-context-patch.mjs
      - name: Verify changes
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npx expo install --check
          npx expo export --platform android --output-dir dist-android
      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dkd-ui.tsx src/dkd-football-context.ts src/dkd-analysis.ts 'app/match/[dkd_id].tsx'
          git commit -m 'fix(v0.7.1): rank selections with football context'
          for dkd_try in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 2
          done
          exit 1

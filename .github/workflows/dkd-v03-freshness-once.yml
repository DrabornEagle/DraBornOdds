name: DraBornOdds v0.3 freshness gate once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dkd-v03-freshness-once.yml']
permissions:
  contents: write
jobs:
  dkd-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate client data to recent collector windows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/dkd-live.ts')
          s=p.read_text()
          old="export async function dkd_fetchMatchOdds(dkd_matchKey:string,dkd_analysis?:dkd_DbAnalysis){const dkd_path=`dbo_latest_odds?select=${dkd_sel}&dbo_match_key=eq.${encodeURIComponent(dkd_matchKey)}&order=dbo_market_key.asc,dbo_selection_key.asc&limit=500`"
          new="export async function dkd_fetchMatchOdds(dkd_matchKey:string,dkd_analysis?:dkd_DbAnalysis){const dkd_fresh=new Date(Date.now()-75*60000).toISOString(),dkd_path=`dbo_latest_odds?select=${dkd_sel}&dbo_match_key=eq.${encodeURIComponent(dkd_matchKey)}&dbo_collected_at=gte.${encodeURIComponent(dkd_fresh)}&order=dbo_market_key.asc,dbo_selection_key.asc&limit=500`"
          if old not in s: raise SystemExit('detail freshness target not found')
          s=s.replace(old,new)
          old="async function dkd_backend(){const dkd_now=new Date(Date.now()-30*60000).toISOString(),dkd_names="
          new="async function dkd_backend(){const dkd_now=new Date(Date.now()-30*60000).toISOString(),dkd_fresh=new Date(Date.now()-75*60000).toISOString(),dkd_names="
          if old not in s: raise SystemExit('backend freshness target not found')
          s=s.replace(old,new)
          old="&dbo_status=eq.scheduled&dbo_start_at=gte.${encodeURIComponent(dkd_now)}&order="
          new="&dbo_status=eq.scheduled&dbo_start_at=gte.${encodeURIComponent(dkd_now)}&dbo_last_seen_at=gte.${encodeURIComponent(dkd_fresh)}&order="
          if old not in s: raise SystemExit('match freshness target not found')
          s=s.replace(old,new,1)
          old="&dbo_market_key=eq.${dkd_name}&order=dbo_collected_at.desc&limit=1000`"
          new="&dbo_market_key=eq.${dkd_name}&dbo_collected_at=gte.${encodeURIComponent(dkd_fresh)}&order=dbo_collected_at.desc&limit=1000`"
          if old not in s: raise SystemExit('odds freshness target not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          rm .github/workflows/dkd-v03-freshness-once.yml
      - name: Commit freshness gate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/dkd-live.ts .github/workflows/dkd-v03-freshness-once.yml
          git commit -m 'fix(v0.3): gate app to fresh collector odds'
          git push origin HEAD:main

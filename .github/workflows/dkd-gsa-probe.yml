name: DraBornOdds public context probe
on:
  push:
    paths: ['.github/workflows/dkd-gsa-probe.yml']
jobs:
  dkd-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Global Sports Archive public HTML
        shell: bash
        run: |
          set -e
          for dkd_term in 'Stade Tunisien' 'Club Africain' 'Kasımpaşa' 'TÜMOSAN Konyaspor'; do
            echo "--- SEARCH $dkd_term ---"
            curl -Ls --max-time 15 -A 'Mozilla/5.0' --get --data-urlencode "term=$dkd_term" 'https://sport-widgets.com/search/autosearch.php' | head -c 5000
            echo
          done
          curl -Ls --max-time 15 -A 'Mozilla/5.0' 'https://globalsportsarchive.com/en/soccer/team/stade-tunisien/16517/' -o /tmp/team.html
          echo '--- Stade row markup ---'
          grep -n -B12 -A30 '>Stade Tunisien<' /tmp/team.html | tail -120 || true
          echo '--- last match full block ---'
          sed -n '19636,19685p' /tmp/team.html | head -100

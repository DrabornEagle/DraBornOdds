name: DraBornOdds public context probe
on:
  push:
    paths: ['.github/workflows/dkd-gsa-probe.yml']
jobs:
  dkd-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Global Sports Archive public HTML
        shell: bash
        run: |
          set -e
          curl -Ls --max-time 15 -A 'Mozilla/5.0' -o /tmp/root.html 'https://globalsportsarchive.com/en/'
          echo '--- inputs/forms around search ---'
          grep -Ein 'League, event or player|search|autocomplete' /tmp/root.html | head -50 || true
          echo '--- scripts ---'
          grep -Eo '<script[^>]+src="[^"]+"' /tmp/root.html | head -50 || true
          echo '--- candidate endpoint tokens ---'
          grep -Eio '[/A-Za-z0-9_.?=&-]{0,120}(search|autocomplete)[/A-Za-z0-9_.?=&-]{0,160}' /tmp/root.html | head -50 || true

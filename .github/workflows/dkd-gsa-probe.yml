name: DraBornOdds public context probe
on:
  push:
    paths: ['.github/workflows/dkd-gsa-probe.yml']
jobs:
  dkd-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Global Sports Archive public HTML
        shell: bash
        run: |
          set -e
          echo '--- slug-only redirects ---'
          curl -Ls --max-time 15 -A 'Mozilla/5.0' -o /tmp/slug.html -w 'ST_URL=%{url_effective} HTTP=%{http_code} SIZE=%{size_download}\n' 'https://globalsportsarchive.com/en/soccer/team/stade-tunisien/'
          curl -Ls --max-time 15 -A 'Mozilla/5.0' -o /tmp/club.html -w 'CA_URL=%{url_effective} HTTP=%{http_code} SIZE=%{size_download}\n' 'https://globalsportsarchive.com/en/soccer/team/club-africain/'
          echo '--- javascript search tokens ---'
          curl -Ls --max-time 15 -A 'Mozilla/5.0' 'https://globalsportsarchive.com/en/resources/assets/js/common/gsa.js' -o /tmp/gsa.js
          curl -Ls --max-time 15 -A 'Mozilla/5.0' 'https://globalsportsarchive.com/en/resources/assets/js/site.js' -o /tmp/site.js
          grep -Ein 'search|autocomplete|ajax|typeahead' /tmp/gsa.js /tmp/site.js | head -100 || true
          echo '--- last match markup ---'
          curl -Ls --max-time 15 -A 'Mozilla/5.0' 'https://globalsportsarchive.com/en/soccer/team/stade-tunisien/16517/' -o /tmp/team.html
          grep -n -B12 -A25 '12.09.2026' /tmp/team.html | head -100 || true
          echo '--- standings markup ---'
          grep -n -B15 -A30 'Standings' /tmp/team.html | tail -100 || true

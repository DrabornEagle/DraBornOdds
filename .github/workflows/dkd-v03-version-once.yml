name: DraBornOdds v0.3 metadata once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/dkd-v03-version-once.yml']
permissions:
  contents: write
jobs:
  dkd-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize v0.3 metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['package.json','package-lock.json']){
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            data.version='0.3.0';
            if(file==='package-lock.json'&&data.packages?.['']) data.packages[''].version='0.3.0';
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }
          const app=JSON.parse(fs.readFileSync('app.json','utf8'));
          app.expo.version='0.3.0';
          app.expo.extra.dkd_version='DKD_draborneagle_v0.3';
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          const home='app/(tabs)/index.tsx';
          fs.writeFileSync(home,fs.readFileSync(home,'utf8').replaceAll('DKD_draborneagle_v0.2','DKD_draborneagle_v0.3'));
          NODE
          rm .github/workflows/dkd-v03-version-once.yml
      - name: Commit synchronized release metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json app.json 'app/(tabs)/index.tsx' .github/workflows/dkd-v03-version-once.yml
          git commit -m 'chore(v0.3): synchronize app and package versions'
          git push origin HEAD:main
